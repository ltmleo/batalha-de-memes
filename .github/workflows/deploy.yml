# Publica o site estático em https://ltmleo.github.io/batalha-de-memes/
#
# A cada push na master: build do Next (export estático para frontend/out),
# upload do artefato e deploy no GitHub Pages (Actions).
#
# Ative uma única vez em Settings → Pages → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Build estático (export)
        # Lê backend/data/estado.json em tempo de build e gera frontend/out/
        run: npm run build
        working-directory: frontend

      - name: Empacotar artefato (frontend/out)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4