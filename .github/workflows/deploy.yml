# Checagens + publicação do site estático em https://ltmleo.github.io/batalha-de-memes/
#
# A cada push/PR: testes e lint do backend, validação do catálogo/estado e
# checagem de tipos do frontend. Só depois disso, e só em push na master, o
# build do Next (export estático para frontend/out) vai para o GitHub Pages.
#
# Ative uma única vez em Settings → Pages → Source: "GitHub Actions".
name: Checar e publicar

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Testes (pytest)
        run: pytest -q

      - name: Validar catálogo e estado
        run: python -m app.cli validar --so-erros

  build:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Checar tipos (tsc)
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build estático (export)
        # Lê backend/data/estado.json em tempo de build e gera frontend/out/
        run: npm run build
        working-directory: frontend

      - name: Empacotar artefato (frontend/out)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
